name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A first answer for a pull request, while build-and-test is still going: the fast tests of the test projects
  # closest to what changed, picked by select-tests.ps1. It adds to build-and-test and replaces none of it, so a
  # green quick job doesn't mean the pull request is good to merge. It runs on the Mac, which is ready soonest.
  quick:
    name: quick (selected fast tests)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      # The changed files come from the API, so the checkout doesn't need the history to compare against.
      - name: Select tests
        id: select
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $files = gh api "repos/$env:GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'
          $projects = @($files | ./.github/scripts/select-tests.ps1)
          "projects=$($projects -join ' ')" >> $env:GITHUB_OUTPUT
          $cooks = [bool]($projects | Where-Object { $_ -notmatch '^tests/(Super|Rendition)\.' })
          "cooks=$($cooks.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($projects.Count -eq 0) {
            Write-Output "Nothing this pull request changed has tests to pick. build-and-test runs them all."
          }
          else {
            Write-Output "Selected: $($projects -join ', ')"
          }

      - name: Find .NET 10 SDK
        id: dotnet
        if: steps.select.outputs.projects != ''
        shell: pwsh
        run: |
          $sdks = if (Get-Command dotnet -ErrorAction SilentlyContinue) { @(dotnet --list-sdks) } else { @() }
          $found = [bool]($sdks -match '^10\.')
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.select.outputs.projects != '' && steps.dotnet.outputs.found != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install glslc
        if: steps.select.outputs.projects != ''
        run: brew install shaderc

      # An example's tests build the example, which cooks its content, so they start from the cook cache as
      # build-and-test does. The quick job never saves it.
      - name: Cook cache key
        id: cook-key
        if: steps.select.outputs.cooks == 'true'
        shell: pwsh
        run: |
          "SUPER_CACHE=$(Join-Path $env:RUNNER_TEMP super-cache)" >> $env:GITHUB_ENV
          "month=$(Get-Date -Format yyyy-MM)" >> $env:GITHUB_OUTPUT
          "sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT

      - name: Restore cook cache
        if: steps.cook-key.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SUPER_CACHE }}
          key: super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-${{ steps.cook-key.outputs.sdk }}-${{ hashFiles('Directory.Build.props', 'src/**', 'tools/**', 'examples/*/content/**', 'assets/**') }}
          restore-keys: |
            super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-${{ steps.cook-key.outputs.sdk }}-
            super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-

      # Every selected project runs even when an earlier one fails, and the step fails if any of them did.
      - name: Test
        if: steps.select.outputs.projects != ''
        shell: pwsh
        env:
          PROJECTS: ${{ steps.select.outputs.projects }}
        run: |
          $failed = @()
          foreach ($project in $env:PROJECTS.Split(' ')) {
            Write-Output "::group::$project"
            dotnet test $project -c Release --filter "Speed!=Slow&Needs!=GPU&Needs!=Assets" --blame-hang-timeout 5m --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { $failed += $project }
            Write-Output "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Output "::error::Failed: $($failed -join ', ')"
            exit 1
          }

  build-and-test:
    # Super runs on Windows and on Apple silicon Macs. The tests need no GPU, so the Mac runner's lack of one doesn't
    # matter.
    # The tests keep every core of a runner busy for about two minutes, so each system runs them in two parts on two
    # runners: the engine's test projects, and the examples'. test-part.ps1 puts every project in tests/ in exactly
    # one part. Both parts build the whole solution, and the engine part also runs Roe and checks the package.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
        part: [engine, examples]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # The runner image usually has a .NET 10 SDK already. Installing one takes about 30 seconds, so only do it
      # when it's missing.
      - name: Find .NET 10 SDK
        id: dotnet
        shell: pwsh
        run: |
          $sdks = if (Get-Command dotnet -ErrorAction SilentlyContinue) { @(dotnet --list-sdks) } else { @() }
          $sdks
          $found = [bool]($sdks -match '^10\.')
          "found=$($found.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.dotnet.outputs.found != 'true'
        with:
          dotnet-version: 10.0.x

      # The build compiles shaders with glslc, which comes with the Vulkan SDK on Windows and with shaderc on a Mac.
      # The tests themselves need no GPU. The recording tests run ffmpeg for real.
      - name: Install glslc and ffmpeg
        if: runner.os == 'macOS'
        run: brew install shaderc ffmpeg

      - uses: jakoch/install-vulkan-sdk-action@v1
        if: runner.os == 'Windows'
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      # Taking ffmpeg.exe straight from the build's zip takes a few seconds, where Chocolatey took about 30.
      - name: Install ffmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '9.0.2'
          $name = "ffmpeg-$version-essentials_build"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          curl.exe -fsSL -o $zip "https://github.com/GyanD/codexffmpeg/releases/download/$version/$name.zip"
          C:\Windows\System32\tar.exe -xf $zip -C $env:RUNNER_TEMP "$name/bin/ffmpeg.exe"
          $bin = "$env:RUNNER_TEMP\$name\bin"
          $bin >> $env:GITHUB_PATH
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1

      - name: Restore
        run: dotnet restore Super.slnx

      # Cooking the Courtyard from scratch takes about 7 minutes. The cook cache is kept between runs, so
      # a run only cooks what changed. Its entries are keyed by what each cook read and by the cook's own
      # build, so an older cache is always safe to start from. The key changes with anything that can
      # change what the cook makes or the cook's build: content, any code (the cook libraries compile in
      # constants from the engine) and the SDK. A new cache is saved then, if the cook changed it. The month
      # in the key starts it afresh once a month, so entries nothing uses any more don't pile up.
      # The cook keeps what it made in SUPER_CACHE, on the same drive as the checkout so cooked content
      # can be hard links to it. The build and the tests both read it.
      # global.json keeps the SDK on .NET 10 whatever else the runner image has. Images still differ in its
      # patch while a new one rolls out, and another compiler gives the cook libraries other bytes, so nothing
      # cooked by one is a hit for the other. A run therefore looks first for a cache its own SDK made, and
      # only then for the newest one.
      - name: Cook cache key
        id: cook-key
        shell: pwsh
        run: |
          "SUPER_CACHE=$(Join-Path $env:RUNNER_TEMP super-cache)" >> $env:GITHUB_ENV
          "month=$(Get-Date -Format yyyy-MM)" >> $env:GITHUB_OUTPUT
          "sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT

      - name: Restore cook cache
        id: cook-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SUPER_CACHE }}
          key: super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-${{ steps.cook-key.outputs.sdk }}-${{ hashFiles('Directory.Build.props', 'src/**', 'tools/**', 'examples/*/content/**', 'assets/**') }}
          restore-keys: |
            super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-${{ steps.cook-key.outputs.sdk }}-
            super-cook-${{ runner.os }}-${{ steps.cook-key.outputs.month }}-

      # The cache is about 2 GB, and saving it takes about 25 seconds and room in the repository's 10 GB of
      # caches, where a new one evicts the oldest. Most commits change code the cook doesn't use, so they get a new
      # key but cook nothing. The cache's entries are listed before and after the build, and it's only saved when
      # the cook added or removed one.
      - name: List cook cache entries
        if: steps.cook-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/list-cook-cache.ps1 -Cache $env:SUPER_CACHE -Out "$env:RUNNER_TEMP/cook-before.txt"

      # The solution builds the cook tool itself, and every game builds it too, for its cook. MSBuild can run those
      # requests on two nodes at once, and in a clean checkout both compile the cook libraries into the same obj
      # folder, which failed with CS2012 when one held the file the other wrote. Built first on its own, the tool and
      # its libraries are up to date by the time the solution gets to them, so nothing compiles twice.
      - name: Build the cook tool
        run: dotnet build tools/Super.Cook.Tool -c Release --no-restore

      - name: Build
        run: dotnet build Super.slnx -c Release --no-restore

      - name: Look for new cook cache entries
        id: cook-new
        if: steps.cook-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./.github/scripts/list-cook-cache.ps1 -Cache $env:SUPER_CACHE -Out "$env:RUNNER_TEMP/cook-after.txt"
          $before = (Get-FileHash "$env:RUNNER_TEMP/cook-before.txt").Hash
          $after = (Get-FileHash "$env:RUNNER_TEMP/cook-after.txt").Hash
          $changed = $before -ne $after
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($changed) {
            Write-Output "The cook changed the cache, so it's saved."
          }
          else {
            Write-Output "The cook added nothing to the cache, so it isn't saved."
          }

      # Saved right after the build, so a failing test doesn't throw the cook away. Both parts cook the same content,
      # so one of them saves it.
      - name: Save cook cache
        if: steps.cook-new.outputs.changed == 'true' && matrix.part == 'examples'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SUPER_CACHE }}
          key: ${{ steps.cook-cache.outputs.cache-primary-key }}

      # Roe fails the run on dead code, and on health findings that roe-baseline.json doesn't already record.
      # Duplicates are printed but don't fail it, since they can't be baselined yet. It runs on Windows only, since it
      # counts some types' members differently on a Mac, and the baseline is Windows'.
      - name: Roe
        if: runner.os == 'Windows' && matrix.part == 'engine'
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet roe dead-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet roe health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet roe dupes | Select-Object -Last 1
          exit 0

      - name: Choose this part's test projects
        shell: pwsh
        run: ./.github/scripts/test-part.ps1 -Part ${{ matrix.part }} -Out test-part.slnf

      # The slowest test takes about 12 seconds. A test that hangs, as one in Super.Physics.Tests once did on the Mac
      # for 17 minutes, is stopped after 5, and the run fails naming it.
      - name: Test
        run: dotnet test test-part.slnf -c Release --no-build --filter "Needs!=GPU&Needs!=Assets" --blame-hang-timeout 5m --blame-hang-dump-type none --logger trx --results-directory TestResults

      # Packs Super as a release does, then builds a small game against the package and runs its tests, so a
      # change that breaks the package fails here and not at the next release. On a Mac too, which checks that the
      # package brings MoltenVK and the cook tool's Mac libraries.
      - name: Check the package
        if: matrix.part == 'engine'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content version.txt -Raw).Trim()
          dotnet pack packaging/nuget/Super.Package.csproj -c Release -o "$env:RUNNER_TEMP/packages"
          ./.github/scripts/test-package.ps1 -Packages "$env:RUNNER_TEMP/packages" -Version $version

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}-${{ matrix.part }}
          path: TestResults/*.trx
          if-no-files-found: ignore
